name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile # also builds the SDK and config plugin (prepare)
      - run: pnpm typecheck
      - name: Typecheck example
        run: pnpm --filter shotgun-mesh-chat-example exec tsc --noEmit
      - name: Simulator typecheck and tests
        run: pnpm --filter mesh-simulator typecheck && pnpm sim:test
      - name: Simulator bench (scenario expectations)
        run: pnpm sim:bench
      - name: Check package contents
        run: pnpm pack --dry-run
